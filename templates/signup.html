{% extends 'base.html' %}
{% block content %}

<div style="max-width: 640px; margin: 2.5rem auto; padding: 0 1rem 3rem;">

  <!-- Page header -->
  <div style="text-align: center; margin-bottom: 2rem;">
    <div style="width: 52px; height: 52px; background: #e6f4ea; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem; color: #2e5c2e;">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22v-4"/><path d="M12 18H8.5a4 4 0 0 1-4-4c0-2.5 2-4.5 4.5-4.5H12"/><path d="M12 18h3.5a4 4 0 0 0 4-4c0-2.5-2-4.5-4.5-4.5H12"/><path d="M12 10V6.5A4.5 4.5 0 0 0 7.5 2"/><path d="M12 10V6.5A4.5 4.5 0 0 1 16.5 2"/></svg>
    </div>
    <h1 style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.75rem; font-weight: 800; color: #0d2b18; margin: 0 0 0.4rem 0; letter-spacing: -0.03em;">Create your account</h1>
    <p style="font-size: 0.875rem; color: #6b7280; margin: 0;">Join AgriSmart and start farming smarter today</p>
  </div>

  <!-- Card -->
  <div style="background: #fff; border: 1px solid rgba(0,0,0,0.06); border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); padding: 2rem 2.5rem;">



    <!-- Signup form -->
    <form id="signupForm" method="POST" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <!-- Profile picture -->
      <div style="display: flex; align-items: center; gap: 1.25rem; padding: 1rem; background: #f8faf8; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid rgba(0,0,0,0.05);">
        <div style="position: relative; flex-shrink: 0;">
          <img id="preview_profile_pic"
            src="{{ url_for('static', filename='icons/user.svg') }}"
            alt="Profile preview"
            style="width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(26,76,27,0.12); background: #e6f4ea;">
          <div style="position: absolute; bottom: 0; right: 0; width: 22px; height: 22px; background: #1a4c1b; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer;"
            onclick="document.getElementById('signup_profile_pic').click();">
            <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </div>
        </div>
        <div>
          <p style="font-size: 0.875rem; font-weight: 600; color: #374151; margin: 0 0 4px 0;">Profile Photo</p>
          <p style="font-size: 0.78rem; color: #6b7280; margin: 0 0 8px 0;">Optional — shows on your profile</p>
          <input id="signup_profile_pic" type="file" name="profile_pic" accept="image/*" style="display:none;">
          <button type="button" id="choosePicBtn"
            style="font-size: 0.78rem; padding: 5px 12px; border-radius: 6px; border: 1px solid rgba(26,76,27,0.2); background: #fff; color: #1a4c1b; font-weight: 600; cursor: pointer; transition: all 0.15s;">
            Choose photo
          </button>
        </div>
      </div>

      <!-- Full name -->
      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 0.4rem;">Full Name</label>
        <input name="display_name" required class="form-control" placeholder="Your full name" value="{{ request.form.get('display_name','') }}">
      </div>

      <!-- Email + Phone (two cols) -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem;">
        <div>
          <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 0.4rem;">Email</label>
          <input name="email" type="email" required class="form-control" placeholder="you@example.com" value="{{ request.form.get('email','') }}">
        </div>
        <div>
          <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 0.4rem;">Phone</label>
          <input name="phone" type="tel" required class="form-control" placeholder="+91-9876543210" value="{{ request.form.get('phone','') }}">
        </div>
      </div>

      <!-- Language -->
      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 0.4rem;">Preferred Language</label>
        <select name="language" required class="form-control">
          <option value="en" {% if request.form.get('language','en')=='en' %}selected{% endif %}>English</option>
          <option value="hi" {% if request.form.get('language')=='hi' %}selected{% endif %}>हिन्दी</option>
          <option value="ta" {% if request.form.get('language')=='ta' %}selected{% endif %}>தமிழ்</option>
          <option value="kn" {% if request.form.get('language')=='kn' %}selected{% endif %}>ಕನ್ನಡ</option>
          <option value="ml" {% if request.form.get('language')=='ml' %}selected{% endif %}>മലയാളം</option>
          <option value="te" {% if request.form.get('language')=='te' %}selected{% endif %}>తెలుగు</option>
        </select>
      </div>

      <!-- State + District -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem;">
        <div>
          <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 0.4rem;">State</label>
          <select name="state" id="signup_state" required class="form-control">
            <option value="">— Select State —</option>
            {% for st in (states if states is defined else []) %}
              <option value="{{ st }}" {% if request.form.get('state')==st %}selected{% endif %}>{{ st }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 0.4rem;">District</label>
          <select name="district" id="signup_district" required class="form-control">
            <option value="">— Select District —</option>
            {% if request.form.get('district') %}
              <option value="{{ request.form.get('district') }}" selected>{{ request.form.get('district') }}</option>
            {% endif %}
          </select>
        </div>
      </div>

      <!-- Land size -->
      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 0.4rem;">Land Size (acres)</label>
        <input name="land_size" type="number" step="0.1" min="0" required class="form-control"
          placeholder="e.g. 2.5"
          value="{{ request.form.get('land_size_acres','') }}">
      </div>

      <!-- Username + Password -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem;">
        <div>
          <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 0.4rem;">Username</label>
          <input name="username" required class="form-control" placeholder="Choose a username" value="{{ request.form.get('username','') }}">
        </div>
        <div>
          <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 0.4rem;">Password</label>
          <input name="password" type="password" required class="form-control" placeholder="Choose a secure password">
        </div>
      </div>

      <!-- Submit -->
      <button type="submit"
        style="width: 100%; padding: 12px; background: #1a4c1b; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.95rem; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; transition: all 0.15s; letter-spacing: -0.01em;"
        onmouseover="this.style.background='#2e5c2e'; this.style.transform='translateY(-1px)'; this.style.boxShadow='0 6px 20px rgba(26,76,27,0.2)';"
        onmouseout="this.style.background='#1a4c1b'; this.style.transform=''; this.style.boxShadow='';">
        Create Account →
      </button>

      <p style="text-align: center; margin-top: 1rem; font-size: 0.82rem; color: #6b7280;">
        Already have an account? <a href="{{ url_for('login') }}" style="color: #1a4c1b; font-weight: 700; text-decoration: none;">Sign In</a>
      </p>

    </form><!-- /signupForm -->

  </div><!-- /card -->
</div>

<script>
  /* Profile picture chooser */
  document.getElementById('choosePicBtn').addEventListener('click', function(){
    document.getElementById('signup_profile_pic').click();
  });
  document.getElementById('signup_profile_pic').addEventListener('change', function(e){
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      document.getElementById('preview_profile_pic').src = ev.target.result;
    };
    reader.readAsDataURL(f);
  });

  /* Dynamic districts */
  const stateSelect = document.getElementById('signup_state');
  stateSelect && stateSelect.addEventListener('change', async function(){
    const st = this.value;
    const districtSel = document.getElementById('signup_district');
    districtSel.innerHTML = '<option>Loading…</option>';
    try {
      const resp = await fetch(`/get_districts?state=${encodeURIComponent(st)}`);
      const j = await resp.json();
      districtSel.innerHTML = '<option value="">— Select District —</option>';
      (j.districts||[]).forEach(d => {
        const o = document.createElement('option');
        o.value = d; o.textContent = d;
        districtSel.appendChild(o);
      });
    } catch(e) {
      districtSel.innerHTML = '<option value="">— error —</option>';
    }
  });

  /* Prepopulate districts on load */
  (async function(){
    const st = stateSelect && stateSelect.value;
    if (!st) return;
    const districtSel = document.getElementById('signup_district');
    districtSel.innerHTML = '<option>Loading…</option>';
    try {
      const resp = await fetch(`/get_districts?state=${encodeURIComponent(st)}`);
      const j    = await resp.json();
      districtSel.innerHTML = '<option value="">— Select District —</option>';
      (j.districts||[]).forEach(d => {
        const o = document.createElement('option');
        o.value = d; o.textContent = d;
        if (d === "{{ request.form.get('district')|escape }}") o.selected = true;
        districtSel.appendChild(o);
      });
    } catch(e) { console.warn('districts', e); }
  })();
</script>

{% endblock %}
